apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'weather-api'
              static_configs:
                - targets: ['weather-api-service.default.svc.cluster.local:5170']
            - job_name: 'payment-api'
              static_configs:
                - targets: ['payment-api-service.default.svc.cluster.local:5180']

      otlp:
        protocols:
          http:
          grpc:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
      otlp/tempo:
        endpoint: tempo:4317  # e.g., tempo.default.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheus]

        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]