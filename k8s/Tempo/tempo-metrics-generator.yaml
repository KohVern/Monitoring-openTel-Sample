apiVersion: v1
kind: Service
metadata:
  name: tempo-metrics-generator
  labels:
    app: tempo
    component: metrics-generator
spec:
  type: ClusterIP
  selector:
    app: tempo
    component: metrics-generator
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: memberlist
      port: 7946
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-metrics-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
      component: metrics-generator
  template:
    metadata:
      labels:
        app: tempo
        component: metrics-generator
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: tempo
          image: grafana/tempo:latest
          args:
            - "-config.file=/etc/tempo/config.yaml"
            - "-target=metrics-generator"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/tempo
      volumes:
        - name: config-volume
          configMap:
            name: tempo-config